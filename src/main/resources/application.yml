server:
  port: 8080

spring:
  application:
    name: neps-backend
  datasource:
    url: "jdbc:mysql://localhost:3306/neps?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai"
    username: root
    password: 212206
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  ai:
    model:
      chat: openai
    openai:
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${AI_API_KEY:unused-in-mock-mode}
      chat:
        completions-path: /chat/completions
        options:
          model: ${AI_CHAT_MODEL:qwen-plus}
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    mcp:
      server:
        enabled: ${MCP_ENABLED:false}
        protocol: STATELESS
        name: neps-environmental-tools
        version: 1.0.0
        type: SYNC
        instructions: 只提供受限的环保数据只读查询工具
        tool-callback-converter: false
        annotation-scanner:
          enabled: false
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        stateless:
          mcp-endpoint: /mcp

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

app:
  upload:
    directory: ${UPLOAD_DIR:./uploads}

  anomaly:
    aqi-threshold: 100
    high-aqi-threshold: 200
    jump-threshold: 80
    high-jump-threshold: 150
    duplicate-window-hours: 24
    duplicate-feedback-count: 3
    high-duplicate-feedback-count: 5
    rule-version: DEMO-RULE-1

  ai:
    mode: ${AI_MODE:mock}
    provider: ${AI_PROVIDER:QWEN}
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    chat-model: ${AI_CHAT_MODEL:qwen-plus}
    vision-model: ${AI_VISION_MODEL:qwen3-vl-flash}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    poll-delay-ms: ${AI_POLL_DELAY_MS:1000}
    max-requests-per-window: ${AI_MAX_REQUESTS_PER_WINDOW:10}
    rate-limit-window-seconds: ${AI_RATE_LIMIT_WINDOW_SECONDS:60}

  trace:
    time-window-hours: 6
    max-distance-km: 20
    direction-tolerance-deg: 45
    method-version: DEMO-TRACE-1

  mcp:
    enabled: ${MCP_ENABLED:false}
    api-key: ${MCP_API_KEY:}
    actor-phone: ${MCP_ACTOR_PHONE:}

